<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barogram — weather with intensity scales</title>
<meta name="description" content="Weather PWA with intensity scales for e-ink readers and phones">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-eink.css">
<link rel="stylesheet" href="css/theme-night.css">
<link rel="stylesheet" href="css/theme-paper.css">
</head>
<body data-theme="eink">

<div class="app">

  <header class="topbar">
    <div class="clock-block">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <div class="place-block">
      <div class="place" id="place" data-i18n="ui.locating">Locating…</div>
      <div class="updated" id="updated" data-i18n="time.never">no data yet</div>
      <div class="cond" id="cond">&nbsp;</div>
    </div>
    <div class="tools">
      <button class="btn" id="btn-theme" type="button">Design</button>
      <button class="btn" id="btn-refresh" type="button" data-i18n="ui.refresh">Refresh</button>
      <button class="btn" id="btn-settings" type="button" data-i18n="ui.place">Place</button>
    </div>
  </header>

  <div class="panel" id="panel" hidden>
    <div class="panel-row">
      <button class="btn" id="btn-geo" type="button" data-i18n="ui.myLocation">My location</button>
      <button class="btn" id="btn-background" type="button">Background updates</button>
      <button class="btn" id="btn-screen" type="button">Keep screen on</button>
      <button class="btn" id="btn-language" type="button">Language</button>
    </div>
    <div class="panel-row">
      <input class="input" id="city-input" type="text"
             data-i18n-placeholder="ui.cityPlaceholder" placeholder="City (for example, Odesa)">
      <button class="btn" id="btn-city" type="button" data-i18n="ui.find">Find</button>
    </div>
    <div class="panel-row"><ul class="found" id="found"></ul></div>
    <div class="panel-row"><p class="hint" id="hint">&nbsp;</p></div>
  </div>

  <main class="cards" id="cards"></main>

  <footer class="footbar">
    <span id="status" data-i18n="status.initial">Open-Meteo data. Hourly updates.</span>
  </footer>

</div>

<script src="js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/metrics.js"></script>
<script src="js/scale.js"></script>
<script src="js/weather.js"></script>
<script src="js/app.js"></script>
</body>
</html>
