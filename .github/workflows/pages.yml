name: Deploy to GitHub Pages

# The app is plain static files, so the repository root is published as-is.
# configure-pages turns Pages on the first time this runs.

# Only manual runs: if Pages is set to "Deploy from a branch", GitHub builds the
# site itself on every push and this workflow would just duplicate it. Run it by
# hand when the Pages source is set to "GitHub Actions" instead.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
