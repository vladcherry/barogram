<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barogram — weather with intensity scales</title>
<meta name="description" content="Weather PWA with intensity scales for e-ink readers and phones">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- iOS takes the home-screen name from here, not from <title>. -->
<meta name="apple-mobile-web-app-title" content="Barogram">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-eink.css">
<link rel="stylesheet" href="css/theme-night.css">
<link rel="stylesheet" href="css/theme-paper.css">
<link rel="stylesheet" href="css/theme-tiles.css">
<!-- Loaded last: on phones it compacts whichever design is active. -->
<link rel="stylesheet" href="css/compact.css">
</head>
<body data-theme="eink">

<div class="app">

  <header class="topbar">
    <div class="clock-block">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <div class="place-block">
      <div class="place" id="place" data-i18n="ui.locating">Locating…</div>
      <div class="updated" id="updated" data-i18n="time.never">no data yet</div>
      <div class="cond" id="cond">&nbsp;</div>
    </div>
    <!-- One button opens everything; its label lives in title/aria-label so it
         translates like the rest of the interface. -->
    <div class="tools">
      <button class="btn btn-icon" id="btn-menu" type="button" aria-expanded="false"
              data-i18n-label="ui.menu" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Install banner: a real prompt where the browser offers one, plain
       instructions where it does not (Safari, and anything else without it). -->
  <div class="install" id="install" hidden>
    <p class="install-text" id="install-text"></p>
    <div class="install-actions">
      <button class="btn" id="btn-install" type="button" data-i18n="ui.install" hidden>Install</button>
      <button class="btn" id="btn-install-close" type="button" data-i18n="ui.installLater">Later</button>
    </div>
  </div>

  <div class="panel" id="panel" hidden>
    <!-- Design row is built in app.js: one button per design, active one marked. -->
    <div class="panel-row" id="design-row"></div>
    <div class="panel-row">
      <button class="btn" id="btn-refresh" type="button" data-i18n="ui.refresh">Refresh</button>
      <button class="btn" id="btn-edit" type="button" data-i18n="ui.edit">Edit cards</button>
      <button class="btn" id="btn-geo" type="button" data-i18n="ui.myLocation">My location</button>
      <button class="btn" id="btn-background" type="button">Background updates</button>
      <button class="btn" id="btn-screen" type="button">Keep screen on</button>
      <button class="btn" id="btn-language" type="button">Language</button>
    </div>
    <!-- In full-screen browsers there is no address bar, so the app has to
         offer the page reload and the version update itself. -->
    <div class="panel-row">
      <button class="btn" id="btn-reload" type="button" data-i18n="ui.reload">Reload page</button>
      <button class="btn" id="btn-update" type="button" data-i18n="ui.update">Update app</button>
      <button class="btn" id="btn-install-help" type="button" data-i18n="ui.installHelp">Install app</button>
      <span class="version" id="version"></span>
    </div>
    <div class="panel-row">
      <input class="input" id="city-input" type="text"
             data-i18n-placeholder="ui.cityPlaceholder" placeholder="City (for example, Odesa)">
      <button class="btn" id="btn-city" type="button" data-i18n="ui.find">Find</button>
    </div>
    <div class="panel-row"><ul class="found" id="found"></ul></div>
    <div class="panel-row"><p class="hint" id="hint"></p></div>
  </div>

  <!-- Shown only while the card editor is open. -->
  <div class="editbar" id="editbar" hidden>
    <button class="btn" id="btn-edit-done" type="button" data-i18n="ui.editDone">Done</button>
    <button class="btn" id="btn-cards-reset" type="button" data-i18n="ui.resetCards">Default set</button>
    <span class="hint" id="edit-hint"></span>
  </div>

  <main class="cards" id="cards"></main>

  <!-- The card library: everything not already on the screen. -->
  <div class="library" id="library" hidden></div>

  <footer class="footbar">
    <span id="status" data-i18n="status.initial">Open-Meteo data. Hourly updates.</span>
  </footer>

</div>

<script src="js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/metrics.js"></script>
<script src="js/icons.js"></script>
<script src="js/scale.js"></script>
<script src="js/weather.js"></script>
<script src="js/app.js"></script>
</body>
</html>
