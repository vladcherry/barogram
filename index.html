<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barogram — погода со шкалами</title>
<meta name="description" content="PWA-погода с интенсивными шкалами для e-ink и телефона">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-eink.css">
<link rel="stylesheet" href="css/theme-night.css">
<link rel="stylesheet" href="css/theme-paper.css">
</head>
<body data-theme="eink">

<div class="app">

  <header class="topbar">
    <div class="clock-block">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <div class="place-block">
      <div class="place" id="place">Определяем место…</div>
      <div class="updated" id="updated">нет данных</div>
      <div class="cond" id="cond">&nbsp;</div>
    </div>
    <div class="tools">
      <button class="btn" id="btn-theme" type="button">Дизайн 1/3</button>
      <button class="btn" id="btn-refresh" type="button">Обновить</button>
      <button class="btn" id="btn-settings" type="button">Место</button>
    </div>
  </header>

  <div class="panel" id="panel" hidden>
    <div class="panel-row">
      <button class="btn" id="btn-geo" type="button">Моё местоположение</button>
      <button class="btn" id="btn-wake" type="button">Фоновое обновление: выкл</button>
      <button class="btn" id="btn-screen" type="button">Не гасить экран: выкл</button>
    </div>
    <div class="panel-row">
      <input class="input" id="city-input" type="text" placeholder="Город (например, Одесса)">
      <button class="btn" id="btn-city" type="button">Найти</button>
    </div>
    <div class="panel-row"><ul class="found" id="found"></ul></div>
    <div class="panel-row"><p class="hint" id="hint"></p></div>
  </div>

  <main class="cards" id="cards"></main>

  <footer class="footbar">
    <span id="status">Данные: Open-Meteo. Обновление раз в час.</span>
  </footer>

</div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/metrics.js"></script>
<script src="js/scale.js"></script>
<script src="js/weather.js"></script>
<script src="js/app.js"></script>
</body>
</html>
