<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barogram — weather with intensity scales</title>
<meta name="description" content="Weather PWA with intensity scales for e-ink readers and phones">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- iOS takes the home-screen name from here, not from <title>. -->
<meta name="apple-mobile-web-app-title" content="Barogram">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-eink.css">
<link rel="stylesheet" href="css/theme-night.css">
<link rel="stylesheet" href="css/theme-paper.css">
<link rel="stylesheet" href="css/theme-tiles.css">
<!-- Loaded last: on phones it compacts whichever design is active. -->
<link rel="stylesheet" href="css/compact.css">
</head>
<body data-theme="eink">

<div class="app">

  <header class="topbar">
    <div class="clock-block">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <div class="place-block">
      <div class="place" id="place" data-i18n="ui.locating">Locating…</div>
      <div class="updated" id="updated" data-i18n="time.never">no data yet</div>
      <div class="cond" id="cond">&nbsp;</div>
    </div>
    <!-- One button opens everything; its label lives in title/aria-label so it
         translates like the rest of the interface. -->
    <div class="tools">
      <button class="btn btn-icon" id="btn-menu" type="button" aria-expanded="false"
              data-i18n-label="ui.menu" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Install banner: a real prompt where the browser offers one, plain
       instructions where it does not (Safari, and anything else without it). -->
  <div class="install" id="install" hidden>
    <p class="install-text" id="install-text"></p>
    <div class="install-actions">
      <button class="btn" id="btn-install" type="button" data-i18n="ui.install" hidden>Install</button>
      <button class="btn" id="btn-install-close" type="button" data-i18n="ui.installLater">Later</button>
    </div>
  </div>

  <!-- Settings as grouped rows: name on the left, current value or a switch on
       the right, so every setting reads without being opened. -->
  <div class="panel" id="panel" hidden>

    <h3 class="sec-title" data-i18n="ui.secView">Appearance</h3>
    <div class="sec">
      <div class="row row-block">
        <span class="row-name" data-i18n="ui.designs">Design</span>
        <div class="choices" id="design-row"></div>
      </div>
      <button class="row" id="btn-language" type="button">
        <span class="row-name" data-i18n="ui.language">Language</span>
        <span class="row-val" id="val-language"></span>
        <span class="row-chev" aria-hidden="true">›</span>
      </button>
      <button class="row" id="btn-edit" type="button">
        <span class="row-name" data-i18n="ui.cardsCount">Cards on screen</span>
        <span class="row-val" id="val-cards"></span>
        <span class="row-chev" aria-hidden="true">›</span>
      </button>
    </div>

    <h3 class="sec-title" data-i18n="ui.secPlace">Place</h3>
    <div class="sec">
      <div class="row">
        <span class="row-name" id="val-place"></span>
        <span class="row-val" id="val-coords"></span>
      </div>
      <button class="row" id="btn-geo" type="button">
        <span class="row-name" data-i18n="ui.myLocation">My location</span>
        <span class="row-chev" aria-hidden="true">›</span>
      </button>
      <div class="row row-block">
        <div class="row-search">
          <input class="input" id="city-input" type="text"
                 data-i18n-placeholder="ui.cityPlaceholder" placeholder="City (for example, Odesa)">
          <button class="btn" id="btn-city" type="button" data-i18n="ui.find">Find</button>
        </div>
        <ul class="found" id="found"></ul>
      </div>
    </div>

    <h3 class="sec-title" data-i18n="ui.secUpdate">Updates</h3>
    <div class="sec">
      <button class="row" id="btn-background" type="button" aria-pressed="false">
        <span class="row-name" data-i18n="ui.background">Background updates</span>
        <span class="switch" id="sw-background" aria-hidden="true"><i></i></span>
      </button>
      <button class="row" id="btn-screen" type="button" aria-pressed="false">
        <span class="row-name" data-i18n="ui.keepScreen">Keep screen on</span>
        <span class="switch" id="sw-screen" aria-hidden="true"><i></i></span>
      </button>
      <button class="row" id="btn-refresh" type="button">
        <span class="row-name" data-i18n="ui.refresh">Refresh</span>
        <span class="row-val" id="val-updated"></span>
      </button>
    </div>

    <h3 class="sec-title" data-i18n="ui.secApp">App</h3>
    <div class="sec">
      <button class="row" id="btn-install-help" type="button">
        <span class="row-name" data-i18n="ui.installHelp">Install app</span>
        <span class="row-chev" aria-hidden="true">›</span>
      </button>
      <button class="row" id="btn-reload" type="button">
        <span class="row-name" data-i18n="ui.reload">Reload page</span>
        <span class="row-chev" aria-hidden="true">›</span>
      </button>
      <button class="row" id="btn-update" type="button">
        <span class="row-name" data-i18n="ui.update">Update app</span>
        <span class="row-val version" id="version"></span>
      </button>
    </div>

    <p class="hint" id="hint"></p>
  </div>

  <!-- Shown only while the card editor is open. -->
  <div class="editbar" id="editbar" hidden>
    <button class="btn" id="btn-edit-done" type="button" data-i18n="ui.editDone">Done</button>
    <button class="btn" id="btn-cards-reset" type="button" data-i18n="ui.resetCards">Default set</button>
    <span class="hint" id="edit-hint"></span>
  </div>

  <main class="cards" id="cards"></main>

  <!-- The card library: everything not already on the screen. -->
  <div class="library" id="library" hidden></div>

  <footer class="footbar">
    <span id="status" data-i18n="status.initial">Open-Meteo data. Hourly updates.</span>
  </footer>

</div>

<script src="js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/metrics.js"></script>
<script src="js/icons.js"></script>
<script src="js/scale.js"></script>
<script src="js/weather.js"></script>
<script src="js/app.js"></script>
</body>
</html>
